<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artifact viewer</title>
<style>
:root{
  --bg:#0a1420;--panel:#0f1e30;--panel2:#132640;--line:#1e3a5c;
  --acc:#00d9ff;--acc2:#00ff9d;--tx:#d6e8f5;--mut:#7a9ab8;
  --k:#7dd3fc;--s:#86efac;--n:#fbbf24;--b:#c084fc;--c:#6b7f99;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:10;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{color:var(--acc);text-decoration:none;font-size:13px;white-space:nowrap}
.back:hover{text-decoration:underline}
.fname{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
  color:var(--acc2);text-transform:uppercase}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12.5px}
.actions button:hover{border-color:var(--acc);color:var(--acc)}
.actions a{font-size:12.5px;color:var(--mut);text-decoration:none}
.actions a:hover{color:var(--acc);text-decoration:underline}
main{max-width:1100px;margin:0 auto;padding:26px 22px 60px}
footer{padding:14px 22px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);
  text-align:center}
.err{color:#f87171;font-family:ui-monospace,monospace;padding:12px;background:#1a0a0a;
  border:1px solid #7f1d1d;border-radius:8px;margin:12px 0;white-space:normal}
.banner{background:#2a1f00;border:1px solid #a16207;color:#fde68a;border-radius:8px;
  padding:10px 16px;margin:0 0 16px;font-size:13px}
.banner code{background:#1f1a00;padding:1px 5px;border-radius:4px}

/* JSON / code */
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,monospace;
  white-space:pre;color:var(--tx)}
pre .k{color:var(--k)} pre .s{color:var(--s)} pre .n{color:var(--n)}
pre .b{color:var(--b)} pre .c{color:var(--c)}
.jsonl-wrap{display:flex;flex-direction:column;gap:10px}
.jsonl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.jsonl-card .ln{background:var(--panel2);padding:4px 14px;font-size:11px;color:var(--mut);
  font-family:ui-monospace,monospace;border-bottom:1px solid var(--line)}
.jsonl-card pre{border:none;border-radius:0;padding:12px 16px}

/* Markdown */
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.4em 0 .5em;color:var(--tx);line-height:1.3;
  border-bottom:1px solid var(--line);padding-bottom:.3em}
.md h1{font-size:28px} .md h2{font-size:22px} .md h3{font-size:18px}
.md h4{font-size:16px} .md h5{font-size:14px} .md h6{font-size:13px}
.md p{margin:.7em 0}
.md code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  font-family:ui-monospace,monospace;font-size:.9em;color:var(--s)}
.md pre{margin:1em 0}
.md blockquote{border-left:3px solid var(--acc);padding:6px 16px;margin:1em 0;background:var(--panel);
  border-radius:0 8px 8px 0;color:var(--mut)}
.md ul,.md ol{padding-left:1.6em;margin:.6em 0}
.md li{margin:.3em 0}
.md hr{border:none;border-top:1px solid var(--line);margin:1.5em 0}
.md strong{color:#fff}
.md em{color:var(--acc2)}

table.md,table.csv{width:100%;border-collapse:collapse;margin:1em 0;font-size:13px}
table.md th,table.csv th{background:var(--panel2);border:1px solid var(--line);padding:8px 12px;
  text-align:left;font-weight:700;color:var(--acc);white-space:nowrap}
table.md td,table.csv td{border:1px solid var(--line);padding:7px 12px;vertical-align:top}
table.md tr:nth-child(even) td,table.csv tr:nth-child(even) td{background:rgba(255,255,255,.02)}

/* picker */
.file-list{display:grid;gap:8px;max-width:560px;margin:0 auto}
.file-list a{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--tx);font-size:13.5px}
.file-list a:hover{border-color:var(--acc);color:var(--acc)}
.file-list .badge{margin-left:auto}
h2.page{font-size:20px;text-align:center;margin:0 0 6px}
p.hint{text-align:center;color:var(--mut);font-size:13px;margin:0 0 22px}
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="index.html">&larr; back to portal</a>
  <span class="fname" id="fname">…</span>
  <span class="badge" id="ftype"></span>
  <div class="actions">
    <button id="btnRaw" title="Toggle raw text">raw</button>
    <button id="btnCopy" title="Copy content to clipboard">copy</button>
    <a id="rawLink" href="#" target="_blank" rel="noopener">view raw file &nearr;</a>
  </div>
</header>
<main id="content"><p class="hint">Loading…</p></main>
<footer id="foot"></footer>

<!--
  EMBEDDED DATA ISLAND: the build step (gen_viewer_data.py) injects the full text of
  each viewable artifact as a JSON map keyed by its relative path. This lets the
  viewer render with NO fetch() at all, so it works from file:// (double-click)
  and over HTTP/Caddy. It is placed in a <script type="application/json"> so the
  HTML parser never tries to execute it.
-->
<script type="application/json" id="artifact-data">
__ARTIFACT_DATA__
</script>

<script>
"use strict";
const content = document.getElementById('content');
const fname   = document.getElementById('fname');
const ftype   = document.getElementById('ftype');
const back    = document.getElementById('back');
const rawLink = document.getElementById('rawLink');
const foot    = document.getElementById('foot');
let rawText = "";
let truncated = false;

const DATA = (function(){
  try {
    const el = document.getElementById('artifact-data');
    return el ? JSON.parse(el.textContent) : {};
  } catch(e){ console.error('artifact-data parse', e); return {}; }
})();

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function hlJSON(s){
  return s
    .replace(/("(?:\\.|[^"\\])*")(\s*:)/g,'<span class="k">$1</span>$2')
    .replace(/("(?:\\.|[^"\\])*")/g,'<span class="s">$1</span>')
    .replace(/\b(true|false|null)\b/g,'<span class="b">$1</span>');
}

function renderJSON(text, isJSONL){
  // Truncated JSON can't be parsed - show raw text with the banner.
  if(truncated){ renderPre(text); return; }
  if(isJSONL){
    const lines = text.trim().split('\n').filter(l=>l.trim());
    const out = lines.map((l,i)=>{
      let body;
      try { body = hlJSON(esc(JSON.stringify(JSON.parse(l), null, 2))); }
      catch(e){ body = '<span style="color:#f87171">parse error: '+esc(e.message)+'</span>\n'+esc(l); }
      return '<div class="jsonl-card"><div class="ln">entry '+(i+1)+' / '+lines.length+'</div><pre>'+body+'</pre></div>';
    }).join('');
    content.innerHTML = banner() + '<div class="jsonl-wrap">'+out+'</div>';
  } else {
    try {
      const obj = JSON.parse(text);
      content.innerHTML = banner() + '<pre>'+hlJSON(esc(JSON.stringify(obj, null, 2)))+'</pre>';
    } catch(e){
      content.innerHTML = banner() + '<pre>'+esc(text)+'</pre><p class="err">JSON parse error: '+esc(e.message)+'</p>';
    }
  }
}

function banner(){
  if(!truncated) return '';
  return '<div class="banner">Showing a truncated sample. Use the <b>view raw file &nearr;</b> action '
       + '(or serve over Caddy and open the file directly) to see the full content.</div>';
}

function renderMarkdown(md){
  const fences = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    fences.push('<pre><code data-lang="'+esc(lang)+'">'+esc(code)+'</code></pre>');
    return '\x00F'+(fences.length-1)+'\x00';
  });
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  md = md.replace(/((?:^\|.*\|\n?)+)/gm, tbl => {
    const lines = tbl.trim().split('\n');
    if(lines.length < 2) return tbl;
    const parse = l => l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head = parse(lines[0]);
    if(!/^\|?[\s\-:|]+\|?$/.test(lines[1])) return tbl;
    const body = lines.slice(2).map(parse);
    let h = '<table class="md"><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
    body.forEach(r=>{ h += '<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; });
    h += '</tbody></table>';
    return h;
  });
  md = md.replace(/^######\s+(.+)$/gm,'<h6>'+inline('$1')+'</h6>')
         .replace(/^#####\s+(.+)$/gm,'<h5>'+inline('$1')+'</h5>')
         .replace(/^####\s+(.+)$/gm,'<h4>'+inline('$1')+'</h4>')
         .replace(/^###\s+(.+)$/gm,'<h3>'+inline('$1')+'</h3>')
         .replace(/^##\s+(.+)$/gm,'<h2>'+inline('$1')+'</h2>')
         .replace(/^#\s+(.+)$/gm,'<h1>'+inline('$1')+'</h1>');
  md = md.replace(/^[-=]{3,}\s*$/gm,'<hr/>');
  md = md.replace(/^>\s?(.*)$/gm, (m,t)=>'<blockquote>'+inline(t)+'</blockquote>');
  md = md.replace(/^(?:[-*+]\s+.+\n?)+/gm, block => {
    const items = block.trim().split('\n').map(l=>l.replace(/^[-*+]\s+/,''));
    return '<ul>'+items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>';
  });
  md = md.replace(/^(?:\d+\.\s+.+\n?)+/gm, block => {
    const items = block.trim().split('\n').map(l=>l.replace(/^\d+\.\s+/,''));
    return '<ol>'+items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ol>';
  });
  md = md.replace(
    /(<table class="md">[\s\S]*?<\/table>|<ul>[\s\S]*?<\/ul>|<ol>[\s\S]*?<\/ol>|<h[1-6]>[\s\S]*?<\/h[1-6]>|<pre>[\s\S]*?<\/pre>|<blockquote>[\s\S]*?<\/blockquote>|<hr\/>)/g,
    '\n\n$1\n\n'
  );
  md = md.split(/\n{2,}/).map(block => {
    const b = block.trim();
    if(!b) return '';
    if(/^(<(h\d|ul|ol|table|pre|hr|blockquote|div|p|code))/i.test(b)) return b;
    if(/^\x00F\d+\x00$/.test(b)) return b;
    return '<p>'+inline(b.replace(/\n/g,' '))+'</p>';
  }).join('\n');
  md = md.replace(/\x00F(\d+)\x00/g,(m,i)=>fences[+i]);
  content.innerHTML = banner() + '<div class="md">'+md+'</div>';
}

function parseCSVLine(line){
  const out = []; let cur = ""; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if(ch === '"'){ inQ = false; }
      else cur += ch;
    } else {
      if(ch === '"'){ inQ = true; }
      else if(ch === ','){ out.push(cur); cur=""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
function renderCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if(!lines.length){ content.innerHTML='<p class="err">empty file</p>'; return; }
  const head = parseCSVLine(lines[0]);
  const body = lines.slice(1).map(parseCSVLine);
  let h = '<table class="csv"><thead><tr>'+head.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  body.forEach(r=>{ h+='<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>'; });
  h+='</tbody></table>';
  content.innerHTML = banner() + h;
}

function renderPre(text){
  content.innerHTML = banner() + '<pre>'+esc(text)+'</pre>';
}

function render(text, ext){
  if(ext==='json')    renderJSON(text,false);
  else if(ext==='jsonl') renderJSON(text,true);
  else if(ext==='md'||ext==='markdown') renderMarkdown(text);
  else if(ext==='csv') renderCSV(text);
  else renderPre(text);
}

function showPicker(){
  fname.textContent = 'Artifact viewer';
  ftype.textContent = 'pick a file';
  const files = Object.keys(DATA).sort();
  let h = '<h2 class="page">Pick a file to view</h2><p class="hint">'+files.length+' artifacts embedded</p><div class="file-list">';
  files.forEach(p=>{
    const ext = (p.split('.').pop()||'').toUpperCase();
    h += '<a href="viewer.html?file='+encodeURIComponent(p)+'">'+esc(p)+'<span class="badge">'+ext+'</span></a>';
  });
  h += '</div>';
  content.innerHTML = h;
}

async function main(){
  const params = new URLSearchParams(location.search);
  let file = params.get('file') || '';
  if(!file){
    const h = (location.hash||'').replace(/^#file=/,'');
    if(h) file = decodeURIComponent(h);
  }
  if(!file){ showPicker(); return; }
  fname.textContent = file;
  rawLink.href = file;
  const ext = (file.split('.').pop()||'').toLowerCase();
  ftype.textContent = ext;

  // Try embedded data first (works from file:// and HTTP). Fall back to fetch
  // so the same file still works if someone opens it via a server with newer data.
  if(Object.prototype.hasOwnProperty.call(DATA, file)){
    rawText = DATA[file];
    truncated = rawText.includes('[truncated for embedded viewer');
    foot.textContent = (rawText.length/1024).toFixed(1)+' KB  ·  '+ext.toUpperCase()+' (embedded)'+(truncated?' [sample]':'');
    render(rawText, ext);
  } else {
    // Fallback: fetch (works over HTTP; blocked from file://)
    content.innerHTML = '<p class="hint">Fetching '+esc(file)+'…</p>';
    let resp;
    try { resp = await fetch(file); }
    catch(e){
      content.innerHTML = '<p class="err">This file is not embedded in the viewer and fetch() '
        +'is blocked from <code>file://</code>.<br><br>Serve over HTTP/Caddy, or regenerate with '
        +'<code>gen_viewer_data.py</code> to embed it.<br><br>'
        +'<a class="back" href="'+esc(file)+'" target="_blank" rel="noopener" style="display:inline-block;padding:8px 14px">'
        +'\u2192 open raw '+esc(file)+'</a></p>';
      return;
    }
    if(!resp.ok){ content.innerHTML = '<p class="err">HTTP '+resp.status+' fetching <code>'+esc(file)+'</code></p>'; return; }
    rawText = await resp.text();
    foot.textContent = (rawText.length/1024).toFixed(1)+' KB  ·  '+ext.toUpperCase();
    render(rawText, ext);
  }

  let showingRaw = false;
  document.getElementById('btnRaw').onclick = ()=>{
    showingRaw = !showingRaw;
    if(showingRaw) renderPre(rawText);
    else render(rawText, ext);
    document.getElementById('btnRaw').style.color = showingRaw?'var(--acc)':'';
  };
  document.getElementById('btnCopy').onclick = ()=>{
    navigator.clipboard.writeText(rawText).then(()=>{
      document.getElementById('btnCopy').textContent='copied \u2713';
      setTimeout(()=>document.getElementById('btnCopy').textContent='copy',1500);
    });
  };
}
main();
</script>
</body>
</html>
